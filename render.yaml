services:
  # ── LinkUp Python Unified ML Service (Career Path + Skill Gap) ──────────
  - type: web
    name: linkup-ml
    runtime: python
    plan: free
    rootDir: connect-ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: KEEP_ALIVE_URL
        sync: false
